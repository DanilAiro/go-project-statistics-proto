syntax = "proto3";

package account;

option go_package = "api-contracts/gen/go/api/proto/account;account";

message AccountByNameRequest {
	string tag = 1;
	string name = 2;

  // Опциональные query-параметры HenrikDev API.
  optional bool force = 3;
}

message AccountRequest {
	string puuid = 1;

  // Опциональные query-параметры HenrikDev API.
  optional bool force = 2;
}

message Account {
  string tag = 1;
  string name = 2;
  string card = 3;
  string puuid = 4;
  string title = 5;
  string region = 6;
  string updated_at = 7;
  repeated string platforms = 8;
  int32 account_level = 9;
}

service AccountService {
  rpc GetAccount(AccountRequest) returns (Account);
    
  rpc GetAccountByName(AccountByNameRequest) returns (Account);
}